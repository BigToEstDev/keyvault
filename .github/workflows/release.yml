# The release of KeyVault (pass-docs, docs/dev/release-setup.md).
#
# A tag v<version> builds every platform and makes a DRAFT release in this repository - the owner checks it and
# publishes it. The tag must equal version.json, and CHANGELOG.md must have the section of the version. A release
# candidate (-rc.N) is marked pre-release: GitHub's "latest" skips it, so the site (latest.json) shows final versions
# only.
# Run by hand, it only builds the chosen platforms: the files are artifacts of the run, no release.
#
# Re-run: a draft is refreshed (its files replaced); a published release is never touched - the run fails.
# Actions are pinned by commit SHA; only the publish job may write.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android:
        description: Android (APK)
        type: boolean
        default: true
      windows:
        description: Windows (msi)
        type: boolean
        default: true
      macos:
        description: macOS arm64 (dmg)
        type: boolean
        default: true
      linux:
        description: Linux (deb)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: version, changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      desktop: ${{ steps.platforms.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of version.json, tag of the core
        id: version
        run: |
          version=$(jq -r '.artifact.version' version.json)
          core=$(tr -d '[:space:]' < core.ref)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME is not v$version of version.json"
              exit 1
            fi
            if ! grep -q "^## \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section ## [$version]"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
      # The desktop matrix: every platform for a tag, the chosen ones by hand (a job's "if" cannot read the matrix)
      - name: Desktop platforms
        id: platforms
        env:
          WINDOWS: ${{ github.ref_type == 'tag' || inputs.windows }}
          MACOS: ${{ github.ref_type == 'tag' || inputs.macos }}
          LINUX: ${{ github.ref_type == 'tag' || inputs.linux }}
        run: |
          all='[
            {"platform": "windows", "name": "Windows (msi)", "runner": "windows-2025", "task": "packageReleaseMsi", "format": "msi", "suffix": "windows-x64.msi"},
            {"platform": "macos", "name": "macOS arm64 (dmg)", "runner": "macos-15", "task": "packageReleaseDmg", "format": "dmg", "suffix": "macos-arm64.dmg"},
            {"platform": "linux", "name": "Linux (deb)", "runner": "ubuntu-24.04", "task": "packageReleaseDeb", "format": "deb", "suffix": "linux-amd64.deb"}
          ]'
          chosen=$(jq -c --arg w "$WINDOWS" --arg m "$MACOS" --arg l "$LINUX"             'map(select((.platform == "windows" and $w == "true") or (.platform == "macos" and $m == "true") or (.platform == "linux" and $l == "true")))' <<< "$all")
          echo "desktop=$chosen" >> "$GITHUB_OUTPUT"

  tests:
    name: tests
    uses: ./.github/workflows/ci.yml

  android:
    name: Android
    needs: [check, tests]
    if: github.ref_type == 'tag' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pass-app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BigToEstDev/kdbx-rust-core
          ref: ${{ needs.check.outputs.core }}
          path: pass-rust-core
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Toolchain of rust-toolchain.toml (with the Android targets)
        working-directory: pass-app
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-ndk@4.1.2
      - name: Android NDK
        run: |
          ndk=$(grep -oP 'val rustNdkVersion = "\K[^"]+' pass-app/build-logic/plugins/src/main/kotlin/ru/kino/rust-bridge-android.gradle.kts)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      # The key goes to a file of the runner only; the build reads KEYVAULT_SIGNING_* (release-signing.kt). A tag
      # without the key fails: a release must not come out unsigned
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYVAULT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::No secret KEYVAULT_SIGNING_KEYSTORE_BASE64 - the release APK would be unsigned"
              exit 1
            fi
            echo "::warning::No signing key - the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keyvault-release.jks"
          echo "KEYVAULT_SIGNING_STORE_FILE=$RUNNER_TEMP/keyvault-release.jks" >> "$GITHUB_ENV"
      - name: Release APK
        working-directory: pass-app
        env:
          KEYVAULT_SIGNING_STORE_PASSWORD: ${{ secrets.KEYVAULT_SIGNING_STORE_PASSWORD }}
          KEYVAULT_SIGNING_KEY_ALIAS: ${{ secrets.KEYVAULT_SIGNING_KEY_ALIAS }}
          KEYVAULT_SIGNING_KEY_PASSWORD: ${{ secrets.KEYVAULT_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Files of the release
        run: |
          rm -f "$RUNNER_TEMP/keyvault-release.jks"
          mkdir dist
          apk=$(ls pass-app/app/build/outputs/apk/release/*.apk)
          case "$apk" in
            *-unsigned.apk) cp "$apk" "dist/keyvault-$VERSION-unsigned.apk" ;;
            *) cp "$apk" "dist/keyvault-$VERSION.apk" ;;
          esac
          cp pass-app/app/build/outputs/mapping/release/mapping.txt "dist/keyvault-$VERSION-android-mapping.txt"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    needs: [check, tests]
    if: needs.check.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pass-app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BigToEstDev/kdbx-rust-core
          ref: ${{ needs.check.outputs.core }}
          path: pass-rust-core
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Toolchain of rust-toolchain.toml
        working-directory: pass-app
        run: rustup toolchain install
      # jpackage builds for the architecture it runs on: the dmg must come from Apple Silicon
      - name: Architecture of the runner
        if: matrix.platform == 'macos'
        run: test "$(uname -m)" = arm64
      - name: Installer
        working-directory: pass-app
        env:
          TASK: ${{ matrix.task }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat ":desktopApp:$TASK"; else ./gradlew ":desktopApp:$TASK"; fi
      - name: Files of the release
        env:
          FORMAT: ${{ matrix.format }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir dist
          files=(pass-app/desktopApp/build/compose/binaries/main-release/"$FORMAT"/*."$FORMAT")
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::Expected one .$FORMAT, found: ${files[*]}"
            exit 1
          fi
          cp "${files[0]}" "dist/keyvault-$VERSION-$SUFFIX"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: draft release
    needs: [check, android, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CORE: ${{ needs.check.outputs.core }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Fingerprint of the APK certificate
        id: cert
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          digest=$("$apksigner" verify --print-certs "dist/keyvault-$VERSION.apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ -z "$digest" ]; then
            echo "::error::The APK is not signed"
            exit 1
          fi
          echo "sha256=$(echo "$digest" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')" >> "$GITHUB_OUTPUT"
      # The contract with the site: it reads releases/latest/download/latest.json - the last release that is not a
      # pre-release
      - name: latest.json
        env:
          CERT: ${{ steps.cert.outputs.sha256 }}
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"
          assets='[]'
          for f in dist/*; do
            name=$(basename "$f")
            case "$name" in
              *.apk) platform=android ;;
              *-windows-x64.msi) platform=windows-x64 ;;
              *-macos-arm64.dmg) platform=macos-arm64 ;;
              *-linux-amd64.deb) platform=linux-amd64 ;;
              *) continue ;;
            esac
            assets=$(jq -c --arg p "$platform" --arg n "$name" --argjson s "$(stat -c %s "$f")" \
              --arg h "$(sha256sum "$f" | cut -d' ' -f1)" --arg u "$base/$name" \
              '. + [{platform: $p, name: $n, size: $s, sha256: $h, url: $u}]' <<< "$assets")
          done
          prerelease=false
          case "$VERSION" in *-rc.*) prerelease=true ;; esac
          jq -n --arg v "$VERSION" --arg t "$TAG" --argjson pre "$prerelease" \
            --arg page "https://github.com/$REPO/releases/tag/$TAG" --arg core "$CORE" --arg cert "$CERT" \
            --argjson assets "$assets" \
            '{version: $v, tag: $t, prerelease: $pre, releasePage: $page, core: $core, apkCertSha256: $cert, assets: $assets}' \
            > dist/latest.json
          cat dist/latest.json
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Notes
        env:
          CERT: ${{ steps.cert.outputs.sha256 }}
        run: |
          {
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[[^]]+\]: / {f=0} f' CHANGELOG.md
            echo
            echo "## Build"
            echo
            echo "- Core: [kdbx-rust-core $CORE](https://github.com/BigToEstDev/kdbx-rust-core/releases/tag/$CORE) - the source of the engine of this build."
            echo "- Android APK certificate SHA-256: \`$CERT\` - check it with \`apksigner verify --print-certs\`; a different one means the file is not ours."
            echo "- Every file is in \`SHA256SUMS\` and has a build provenance attestation: \`gh attestation verify <file> -R $REPO\`."
            echo
            echo "## Installing"
            echo
            echo "- Windows: the installer is not signed yet - SmartScreen may warn: More info → Run anyway."
            echo "- macOS (Apple Silicon): the app is not signed yet. Right-click KeyVault in Applications → Open → Open; on macOS 15 and later: System Settings → Privacy & Security → Open Anyway."
            echo "- Linux: \`sudo apt install ./keyvault-$VERSION-linux-amd64.deb\`."
          } > notes.md
          cat notes.md
      # A draft is refreshed; a published release is left alone and the run fails
      - name: Draft release
        run: |
          prerelease=()
          case "$VERSION" in *-rc.*) prerelease=(--prerelease) ;; esac
          if draft=$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already - nothing is changed"
              exit 1
            fi
            gh release edit "$TAG" -R "$REPO" --title "KeyVault $VERSION" --notes-file notes.md "${prerelease[@]}"
            gh release upload "$TAG" -R "$REPO" --clobber dist/*
          else
            gh release create "$TAG" -R "$REPO" --draft --verify-tag --title "KeyVault $VERSION" \
              --notes-file notes.md "${prerelease[@]}" dist/*
          fi
